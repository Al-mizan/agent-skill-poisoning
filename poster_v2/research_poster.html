<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Lingual Agent Skill Poisoning: Interactive Research Poster Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f1d;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
      overflow-y: scroll;
    }

    /* Fixed top toolbar */
    .toolbar {
      position: sticky;
      top: 14px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 800;
      color: #93c5fd;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding-right: 8px;
      border-right: 1px solid #334155;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      background: #2563eb;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      font-weight: 700;
    }

    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    /* Outer poster stage */
    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 20px 80px 20px;
    }

    .poster-container {
      width: 2700px;
      height: 3600px;
      transform-origin: top center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      width: 2700px;
      height: 3600px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-title">27" × 36" Academic Poster (v2)</div>
    <div class="btn-group">
      <button class="btn active" id="btnFit" onclick="fitToScreen()">Fit Screen</button>
      <button class="btn" id="btn40" onclick="setScale(0.40)">40%</button>
      <button class="btn" id="btn60" onclick="setScale(0.60)">60%</button>
      <button class="btn" id="btn100" onclick="setScale(1.0)">100% (1:1 Print)</button>
    </div>
    <div class="btn-group" style="padding-left: 8px; border-left: 1px solid #334155;">
      <a class="btn btn-primary" href="research_poster_print.html" target="_blank">Full Canvas ↗</a>
      <a class="btn" href="research_poster_27x36.png" download>Download PNG</a>
      <a class="btn" href="research_poster_27x36.pdf" target="_blank">Print / PDF</a>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="poster-container" id="posterContainer">
      <iframe src="research_poster_print.html" title="Poster Print Canvas"></iframe>
    </div>
  </div>

  <script>
    const container = document.getElementById('posterContainer');
    const stage = document.getElementById('stage');
    let currentScale = 1.0;

    function setScale(scale) {
      currentScale = scale;
      container.style.transform = 'scale(' + scale + ')';
      
      // Update wrapper dimensions so scrolling works naturally
      const scaledWidth = 2700 * scale;
      const scaledHeight = 3600 * scale;
      stage.style.height = (scaledHeight + 120) + 'px';

      document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
      if (Math.abs(scale - 0.40) < 0.01) document.getElementById('btn40').classList.add('active');
      else if (Math.abs(scale - 0.60) < 0.01) document.getElementById('btn60').classList.add('active');
      else if (Math.abs(scale - 1.0) < 0.01) document.getElementById('btn100').classList.add('active');
    }

    function fitToScreen() {
      const availWidth = window.innerWidth - 60;
      const availHeight = window.innerHeight - 100;
      const scaleX = availWidth / 2700;
      const scaleY = availHeight / 3600;
      const fitScale = Math.min(scaleX, scaleY);
      setScale(Math.max(0.2, fitScale));
      document.getElementById('btnFit').classList.add('active');
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('btnFit').classList.contains('active')) {
        fitToScreen();
      }
    });

    // Auto-fit on load
    window.addEventListener('load', fitToScreen);
  </script>

</body>
</html>
